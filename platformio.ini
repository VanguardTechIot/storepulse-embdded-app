[platformio]
default_envs = smoke-node

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.4.3

[env:smoke-node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board_build.partitions = huge_app.csv
build_src_filter = +<smoke-node/>
lib_deps =
    ${env.lib_deps}
    256dpi/MQTT@^2.5.3
    https://github.com/modest-iot/modest-iot-nano-framework.git#v1.1.2

[env:common-area-node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32cam
board_build.partitions = huge_app.csv
build_src_filter = +<common-area-node/>
lib_deps =
    ${env.lib_deps}
    256dpi/MQTT@^2.5.3
    https://github.com/modest-iot/modest-iot-nano-framework.git#v1.1.2

[env:consumption-node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board_build.partitions = huge_app.csv
build_src_filter = +<consumption-node/>
lib_deps =
    ${env.lib_deps}
    256dpi/MQTT@^2.5.3
    https://github.com/modest-iot/modest-iot-nano-framework.git#v1.1.2

[env:intrusion-node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board_build.partitions = huge_app.csv
build_src_filter = +<intrusion-node/>
lib_deps =
    ${env.lib_deps}
    256dpi/MQTT@^2.5.3
    https://github.com/modest-iot/modest-iot-nano-framework.git#v1.1.2
